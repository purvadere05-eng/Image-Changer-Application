<script>
        document.write("<h1>Welcome to Js</h1>")

      //  var name = "React"

       // name = "welcome to js"

        //let a = 10;
       // let a = 20; // this will give error because let is block scoped and cannot be redeclared in the same scope -->
       // a = 40; // this is valid because we are not redeclaring the variable but reassigning the value -->

        //const c = 30; 
        // c = 40; // this will give error because const is block scoped and cannot be reassigned -->
        
     //Types of data
     var test = 20;
     document.write(typeof test +"<br>") // number
     var test1 = "Hello";
     document.write(typeof test1 +"<br>") // string
     var test2 = true;
     document.write(typeof test2 +"<br>") // boolean

     //operators
     var a = 10;
     var b = 20;
     var c = a + b;
     document.write(c + "<br>");

     var d = a - b;
     document.write(d + "<br>");

     var e = a * b;
     document.write(e + "<br>");

     var f = a / b;
     document.write(f + "<br>");
     
     var g = a % b;
     document.write(g + "<br>");

     var h = a ** b;
     document.write(h + "<br>");

     var i = a++;
     document.write(i + "<br>");

     var j = ++a;
     document.write(j + "<br>");

     var k = a--;
     document.write(k + "<br>");

     var l = --a;
     document.write(l + "<br>");

     var m = a == b;
     document.write(m + "<br>");

     var n = a != b;
     document.write(n + "<br>");

     var o = a > b;
     document.write(o + "<br>");

     var p = a < b;
     document.write(p + "<br>");

     var q = a >= b;
     document.write(q + "<br>");

     var r = a <= b;
     document.write(r + "<br>");

     var s = a && b;
     document.write(s + "<br>");

     var t = a || b;
     document.write(t + "<br>");

     var u = !a;
     document.write(u + "<br>");

     var v = a ? "true" : "false";
     document.write(v + "<br>");

     var w = a ?? b;
     document.write(w + "<br>");


      //  document.write(name +"<br>")

      //  document.write("<br>"+c)
    </script>
